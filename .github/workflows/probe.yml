# Test builds for the E6430 crash hunt (docs/phase5-plan.md, 5.14). Run by hand from the
# Actions tab or `gh workflow run probe.yml`; every variant is a Windows build with symbols
# (the .pdb goes with the .exe so a panic's backtrace names functions). Not part of CI.
name: Probe builds

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  app:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The failing build with symbols, and the abort control.
          - { name: app-unwind, env: { CARGO_PROFILE_RELEASE_PANIC: unwind } }
          - { name: app-abort, env: { CARGO_PROFILE_RELEASE_PANIC: abort } }
          # Round 1 (compiler settings: nolto, cgu16, opt1, opt2) crashed the same way; see
          # the git history of this file for how they were set.
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: probe-${{ matrix.name }}
      - name: Build
        shell: pwsh
        env:
          CARGO_PROFILE_RELEASE_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: limited
        run: cargo build --release -p omp-app
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/${{ matrix.name }} | Out-Null
          Copy-Item target/release/omp-app.exe out/${{ matrix.name }}/
          Copy-Item target/release/omp_app.pdb out/${{ matrix.name }}/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out

  probe:
    # eframe's own window with the app's options (tools/gl-probe), unwinding and aborting.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        panic: [unwind, abort]
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gl-probe
          key: probe-stock-${{ matrix.panic }}
      - name: Build
        shell: pwsh
        working-directory: tools/gl-probe
        env:
          CARGO_PROFILE_RELEASE_PANIC: ${{ matrix.panic }}
        run: cargo build --release
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out/probe-${{ matrix.panic }} | Out-Null
          Copy-Item tools/gl-probe/target/release/gl-probe.exe out/probe-${{ matrix.panic }}/
          Copy-Item tools/gl-probe/target/release/gl_probe.pdb out/probe-${{ matrix.panic }}/
      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ matrix.panic }}
          path: out
