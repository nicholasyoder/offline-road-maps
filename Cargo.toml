[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicholasyoder/offline-road-maps"

[workspace.dependencies]
omp-core = { path = "crates/core" }

[workspace.lints.rust]
# Denied rather than forbidden so a module (e.g. core's mmap reader) can opt in with #[allow(unsafe_code)].
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Unwinding, so a worker's panic is caught and shown as an error, not an abort (5.1 R8).
panic = "unwind"

# For perf and heaptrack (phase 5 step 5.2): the release build with symbols and line tables.
[profile.profiling]
inherits = "release"
strip = false
debug = "limited"

# The builder's profile (what CI builds); it unwinds too, so crashes print backtraces.
[profile.release-builder]
inherits = "release"
panic = "unwind"
