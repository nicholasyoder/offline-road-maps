[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicholasyoder/offline-road-maps"

[workspace.dependencies]
omp-core = { path = "crates/core" }

[workspace.lints.rust]
# Denied rather than forbidden so a module (e.g. core's mmap reader) can opt in with #[allow(unsafe_code)].
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Builder releases keep unwinding so crashes still print backtraces.
[profile.release-builder]
inherits = "release"
panic = "unwind"
