[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nicholasyoder/offline-road-maps"

[workspace.dependencies]
omp-core = { path = "crates/core" }

[workspace.lints.rust]
# Denied rather than forbidden so a module (e.g. core's mmap reader) can opt in with #[allow(unsafe_code)].
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Abort. R8 (5.1) made this "unwind" so workers could catch a panic, but every build with it
# crashes at start-up on the E6430 (GL): Surface::configure fails with "Failed to wait for
# GPU to come idle" (5.10). The catches in the loader and workers stay and work in tests,
# debug builds and the builder's profile. Not a bug of ours: a plain eframe window does the same,
# and a tolerated error breaks the next resize (phase5-plan.md 5.14, decision 12).
panic = "abort"

# For perf and heaptrack (phase 5 step 5.2): the release build with symbols and line tables.
[profile.profiling]
inherits = "release"
strip = false
debug = "limited"

# The builder's profile (what CI builds); it unwinds too, so crashes print backtraces.
[profile.release-builder]
inherits = "release"
panic = "unwind"
