[package]
name = "gl-probe"
version = "0.1.0"
edition = "2024"
publish = false

# A stock eframe window with the app's graphics options and nothing else (phase5-plan.md 5.14,
# item 2): does an unwinding build of a plain egui app on wgpu fail on the E6430 as ours does?
# Not part of the app's workspace; CI builds it with `cargo build --release` and the variants
# set CARGO_PROFILE_RELEASE_PANIC (unwind or abort) in the environment.
[workspace]

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = false
debug = "limited"
panic = "abort"
