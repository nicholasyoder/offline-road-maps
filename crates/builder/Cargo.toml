[package]
name = "omp-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
fast_paths = "1.0.0"
flate2 = "1.1.10"
fst = "0.4.7"
hex = "0.4"
jiff = "0.2"
md-5 = "0.11"
memmap2 = "0.9.12"
omp-core.workspace = true
osmpbf = "0.3.8"
rayon = "1.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls", "json"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
zstd = "0.14.3"

[lints]
workspace = true
