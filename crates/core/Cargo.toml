[package]
name = "omp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fst = "0.4.7"
# Time zone rules (phase 4 step 4.5), from its bundled tz database so every computer gives
# the same answers; `tz-system` for the computer's own zone.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-normalization = "0.1.26"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = { version = "0.14.3", default-features = false, features = ["experimental"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
