# The North America flight (north-america.toml) with 10,000 pushpins spread over the pack (phase 4
# step 4.11): its frame times against north-america.toml's are what the pins cost.
# omp-app --bench crates/app/bench/north-america-pins.toml --pack $OMP_WORK/packs/north-america
#
# Bench flight across North America: the exit-criteria flight of phase1-plan.md.
# Jumps between cities, pans and zooms at every zoom from z3 to z17.
# omp-app --bench crates/app/bench/north-america.toml --pack $OMP_WORK/packs/north-america
#
# Each step moves to lat/lon/zoom at once (seconds = 0, a jump, which then waits until the
# view is fully detailed) or linearly over `seconds`. `hold` stays put afterwards.
name = "north-america-pins"
# 10,000 pushpins spread over the pack, the same each run.
pins = 10000
window = [1280, 800]
# Miami to Seattle (phase3-plan.md 3.9), asked as the pack opens, so on a fresh start it is
# the first route from a cold stick; shown until the route steps at the end.
route = "25.7617,-80.1918;47.6062,-122.3321"

[[step]]
label = "continent z3"
lat = 45.0
lon = -100.0
zoom = 3
hold = 1

[[step]]
label = "zoom to z5"
zoom = 5
seconds = 3

