# 5.2: the print page's memory over time (RSS polled from outside): the coast-to-coast
# route, then Letter map pages at 300, 360 and 600 dpi and its directions at 360 dpi.
name = "print-rss"
window = [1280, 800]
[[step]]
label = "route: coast to coast"
lat = 38.0
lon = -98.0
zoom = 4.2
route = "40.7128,-74.0060;41.8781,-87.6298;39.7392,-104.9903;33.4484,-112.0740;34.0522,-118.2437"
hold = 3
[[step]]
label = "print: map at 300 dpi"
print = "map"
print_dpi = 300
hold = 3
[[step]]
label = "print: map at 360 dpi"
print = "map"
print_dpi = 360
hold = 3
[[step]]
label = "print: map at 600 dpi"
print = "map"
print_dpi = 600
hold = 3
[[step]]
label = "print: directions at 360 dpi"
print = "directions"
print_dpi = 360
hold = 3
