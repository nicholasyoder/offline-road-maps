[package]
name = "omp-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# Only for its feature: the monochrome emoji fonts, for the search results' kind icons (search/draw.rs).
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
# Shaping and glyph outlines for labels: the versions egui already uses (text.rs).
harfrust = { version = "0.12.0", default-features = false, features = ["std"] }
# omp-core's, for the schedule's times (its features, the bundled tz database, come from there).
jiff = { version = "0.2", default-features = false, features = ["std"] }
# Already in the tree through wgpu; logger.rs prints its records.
log = "0.4.34"
lyon_tessellation = "1.0.23"
# Already in the tree through png; pdf.rs compresses the pages with it.
miniz_oxide = { version = "0.8.9", default-features = false, features = ["with-alloc"] }
omp-core.workspace = true
png = "0.18.1"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
toml = "1.1.8"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through eframe; used to pick X11 for the bench.
winit = { version = "0.30.13", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
