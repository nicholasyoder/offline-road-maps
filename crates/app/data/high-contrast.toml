# High contrast: white land, no tints, black and dark grey roads with the widths kept,
# black labels with white halos. For a plainer, sharper map on screen, and the one to pick
# before printing in black and white. Compiled into the app; see default.toml for the format.

version = 1
name = "High contrast"
land = "#ffffff"

[overlay]
route = "#0a2a9e"
restricted = "#c8c8c8"
picked = "#000000"
alternative = "#808080"
connector = "#000000"
halo = "#ffffff"
start = "#006b2e"
via = "#b35a00"
end = "#b00020"
here = "#0a2a9e"
print_rect = "#000000"

[colors]
water = "#9dbfe0"
water_label = "#10315a"
forest = "#e3e8de"
park = "#dde6d8"
text = "#000000"
halo = "#ffffff"

[widths]
# From z12 up, each class is `minor` plus one step per rank above it (tertiary 1 ...
# motorway 5), the step being 0.3, 0.4, 0.6, 1.0 and 1.6 points at z12, 13, 14, 16 and 18.
# Below z12, where minor roads are not drawn, the main roads taper off on their own.
motorway = [[4, 0.8], [6, 1.1], [8, 1.4], [10, 1.7], [12, 2.0], [13, 3.0], [14, 5.5], [16, 12.0], [18, 26.0]]
trunk = [[5, 0.7], [7, 1.0], [10, 1.4], [12, 1.7], [13, 2.6], [14, 4.9], [16, 11.0], [18, 24.4]]
primary = [[7, 0.6], [9, 0.8], [10, 1.0], [12, 1.4], [13, 2.2], [14, 4.3], [16, 10.0], [18, 22.8]]
secondary = [[9, 0.5], [10, 0.6], [11, 0.8], [12, 1.1], [13, 1.8], [14, 3.7], [16, 9.0], [18, 21.2]]
tertiary = [[10, 0.5], [12, 0.8], [13, 1.4], [14, 3.1], [16, 8.0], [18, 19.6]]
link = [[10, 0.6], [13, 2.0], [16, 6.0], [18, 14.0]]
minor = [[12, 0.5], [13, 1.0], [14, 2.5], [16, 7.0], [18, 18.0]]
service = [[13, 0.4], [14, 1.0], [16, 3.5], [18, 9.0]]

# Casings add about a point on each side: from z8 for motorways and trunk roads, from z10
# for primary and secondary roads (earlier, they darken the whole grid), from z13 for the
# rest.
casing_motorway = [[7, 0.0], [8, 1.0], [12, 2.0], [15, 3.0], [18, 4.0]]
casing_main = [[9.5, 0.0], [10.5, 1.0], [13, 2.0], [15, 3.0], [18, 4.0]]
casing_minor = [[12, 0.0], [13, 1.0], [15, 2.0], [18, 3.0]]

# A road in a tunnel: its colours faded most of the way to white, the casing dashed.
[tunnel]
fade = 0.6
casing_dash = [3, 2]

# A road on a bridge: a black casing.
[bridge]
casing = "#000000"

# --- Land cover, bottom first ---

[[rule]]
layer = "landcover"
class = "farmland"
pass = "landcover"
color = "#f7f7f7"

[[rule]]
layer = "landcover"
class = "residential"
pass = "landcover"
color = "#f4f4f4"

[[rule]]
layer = "landcover"
class = ["commercial", "retail"]
pass = "landcover"
color = "#f1f1f1"

[[rule]]
layer = "landcover"
class = "industrial"
pass = "landcover"
color = "#eeeeee"

[[rule]]
layer = "landcover"
class = ["forest", "wood"]
pass = "landcover"
color = "forest"

# National parks and other protected areas: large, so only a light green wash.
[[rule]]
layer = "landcover"
class = "protected_area"
pass = "landcover"
color = "#00000008"

[[rule]]
layer = "landcover"
class = "park"
pass = "landcover"
color = "park"

# --- Water ---

[[rule]]
layer = "water"
class = ["ocean", "lake", "riverbank"]
pass = "water"
color = "water"

[[rule]]
layer = "waterways"
class = "stream"
pass = "waterlines"
color = "water"
width = [[13, 0.6], [16, 1.5], [18, 3.0]]
label = { font = "italic", size = 10, color = "water_label", priority = 5, placement = "line", minzoom = 14 }

[[rule]]
layer = "waterways"
class = "canal"
pass = "waterlines"
color = "water"
width = [[10, 0.6], [14, 2.0], [18, 6.0]]
label = { font = "italic", size = 11, color = "water_label", priority = 10, placement = "line", minzoom = 13 }

[[rule]]
layer = "waterways"
class = "river"
pass = "waterlines"
color = "water"
width = [[8, 0.7], [12, 1.5], [14, 2.5], [18, 8.0]]
label = { font = "italic", size = [[10, 11], [16, 13]], color = "water_label", priority = 15, placement = "line", minzoom = 11 }

# --- Boundaries ---

[[rule]]
layer = "boundaries"
class = "admin_8"
pass = "boundaries"
color = "#808080"
width = [[11, 0.6], [16, 1.2]]
dash = [3, 2]

[[rule]]
layer = "boundaries"
class = "admin_6"
pass = "boundaries"
color = "#606060"
width = [[8, 0.6], [14, 1.4]]
dash = [5, 3]

[[rule]]
layer = "boundaries"
class = "admin_4"
pass = "boundaries"
color = "#404040"
width = [[3, 0.7], [8, 1.4], [14, 2.2]]
dash = [8, 3]

[[rule]]
layer = "boundaries"
class = "admin_2"
pass = "boundaries"
color = "#000000"
width = [[0, 0.8], [6, 1.6], [12, 2.8]]

# --- Rail and ferries ---

[[rule]]
layer = "rail"
class = "rail_service"
pass = "rail"
color = "#707070"
width = [[13, 0.6], [16, 1.2]]

[[rule]]
layer = "rail"
class = "rail"
pass = "rail"
color = "#303030"
width = [[9, 0.5], [12, 0.8], [14, 1.3], [16, 2.0]]

[[rule]]
layer = "ferries"
class = "ferry"
pass = "ferries"
color = "#000000"
width = [[7, 0.7], [12, 1.2], [16, 1.8]]
dash = [6, 4]
label = { font = "italic", size = 10, color = "#000000", priority = 5, placement = "line", minzoom = 12 }

# --- Roads, least important first ---

[[rule]]
layer = "roads"
class = ["service_other", "service_drive_through", "service_parking_aisle", "service_driveway", "service_alley", "service"]
pass = "roads"
color = "#ffffff"
width = "service"
casing = "#707070"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = ["living_street", "residential", "unclassified"]
pass = "roads"
color = "#ffffff"
width = "minor"
casing = "#404040"
casing_width = "casing_minor"
label = { size = [[14, 10], [17, 12]], priority = 20, placement = "line", minzoom = 15 }

[[rule]]
layer = "roads"
class = "tertiary_link"
pass = "roads"
color = "#ffffff"
width = "link"
casing = "#404040"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = "secondary_link"
pass = "roads"
color = "#808080"
width = "link"
casing = "#000000"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = "primary_link"
pass = "roads"
color = "#4d4d4d"
width = "link"
casing = "#000000"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = "trunk_link"
pass = "roads"
color = "#2b2b2b"
width = "link"
casing = "#000000"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = "motorway_link"
pass = "roads"
color = "#000000"
width = "link"
casing = "#000000"
casing_width = "casing_minor"

[[rule]]
layer = "roads"
class = "tertiary"
pass = "roads"
color = "#ffffff"
width = "tertiary"
casing = "#404040"
casing_width = "casing_minor"
minzoom = 11
label = { size = [[13, 10], [17, 12]], priority = 30, placement = "line", minzoom = 14 }

[[rule]]
layer = "roads"
class = "secondary"
pass = "roads"
color = "#808080"
width = "secondary"
casing = "#000000"
casing_width = "casing_main"
label = { size = [[12, 10], [17, 12]], priority = 40, placement = "line", minzoom = 13 }
shields = { size = [[11, 9.5], [16, 11]], priority = 45, minzoom = 11 }

[[rule]]
layer = "roads"
class = "primary"
pass = "roads"
color = "#4d4d4d"
width = "primary"
casing = "#000000"
casing_width = "casing_main"
label = { size = [[12, 10], [17, 13]], priority = 50, placement = "line", minzoom = 12 }
shields = { size = [[9, 9.5], [16, 11]], priority = 58, minzoom = 9 }

[[rule]]
layer = "roads"
class = "trunk"
pass = "roads"
color = "#2b2b2b"
width = "trunk"
casing = "#000000"
casing_width = "casing_motorway"
label = { size = [[12, 10], [17, 13]], priority = 60, placement = "line", minzoom = 12 }
shields = { size = [[7, 9.5], [12, 10.5], [16, 12]], priority = 66, minzoom = 7 }

[[rule]]
layer = "roads"
class = "motorway"
pass = "roads"
color = "#000000"
width = "motorway"
casing = "#000000"
casing_width = "casing_motorway"
label = { size = [[12, 10], [17, 13]], priority = 70, placement = "line", minzoom = 13 }
shields = { size = [[5, 9.5], [12, 10.5], [16, 12]], priority = 76, minzoom = 5 }

# --- Places (labels only, step 1.7) ---

[[rule]]
layer = "places"
class = "country"
label = { font = "bold", size = [[1, 11], [5, 16]], color = "#000000", priority = 100, maxzoom = 7 }

[[rule]]
layer = "places"
class = "state"
label = { font = "bold", size = [[3, 10], [7, 13]], color = "#000000", priority = 90, maxzoom = 10 }

[[rule]]
layer = "places"
class = ["ocean", "sea"]
label = { font = "italic", size = [[0, 11], [6, 15]], color = "water_label", priority = 85 }

[[rule]]
layer = "places"
class = "bay"
label = { font = "italic", size = 11, color = "water_label", priority = 25 }

[[rule]]
layer = "places"
class = "city"
label = { font = "bold", size = [[4, 11], [8, 14], [12, 17]], color = "#000000", priority = 80, maxzoom = 15 }

[[rule]]
layer = "places"
class = "town"
label = { size = [[7, 10], [11, 13], [14, 15]], color = "#000000", priority = 70, maxzoom = 16 }

[[rule]]
layer = "places"
class = "village"
label = { size = [[10, 10], [14, 13]], priority = 55 }

[[rule]]
layer = "places"
class = "suburb"
label = { size = [[11, 10], [14, 13]], color = "#000000", priority = 45 }

[[rule]]
layer = "places"
class = "hamlet"
label = { size = [[12, 10], [15, 12]], priority = 35 }

[[rule]]
layer = "places"
class = ["neighbourhood", "locality"]
label = { size = [[13, 10], [16, 12]], color = "#000000", priority = 25 }

# --- Area labels (label points from the builder) ---

[[rule]]
layer = "labels"
class = ["lake", "river", "riverbank", "bay"]
label = { font = "italic", size = [[8, 10], [14, 13]], color = "water_label", priority = 20 }

[[rule]]
layer = "labels"
class = "protected_area"
label = { size = [[6, 10], [12, 12]], color = "#000000", priority = 22 }

[[rule]]
layer = "labels"
class = ["park", "forest", "wood"]
label = { size = [[10, 10], [15, 12]], color = "#000000", priority = 15 }

# --- Points of interest: an icon and the name beside it ---

[[rule]]
layer = "pois"
class = "airport"
icon = "airport"
icon_color = "#1a1a1a"
label = { size = 11, priority = 60, minzoom = 11 }

[[rule]]
layer = "pois"
class = "hospital"
icon = "hospital"
icon_color = "#1a1a1a"
label = { size = 10, color = "#000000", priority = 45, minzoom = 14 }

[[rule]]
layer = "pois"
class = "rest_area"
icon = "rest_area"
icon_color = "#1a1a1a"
label = { size = 10, priority = 40, minzoom = 13 }

[[rule]]
layer = "pois"
class = "fuel"
icon = "fuel"
icon_color = "#1a1a1a"
label = { size = 10, priority = 35, minzoom = 15 }

[[rule]]
layer = "pois"
class = "charging_station"
icon = "charging_station"
icon_color = "#1a1a1a"
label = { size = 10, priority = 30, minzoom = 15 }

[[rule]]
layer = "pois"
class = "campground"
icon = "campground"
icon_color = "#1a1a1a"
label = { size = 10, color = "#000000", priority = 30, minzoom = 13 }

[[rule]]
layer = "pois"
class = "attraction"
icon = "attraction"
icon_color = "#1a1a1a"
label = { size = 10, priority = 28, minzoom = 14 }

[[rule]]
layer = "pois"
class = "hotel"
icon = "hotel"
icon_color = "#1a1a1a"
label = { size = 10, priority = 25, minzoom = 15 }

[[rule]]
layer = "pois"
class = "restaurant"
icon = "restaurant"
icon_color = "#1a1a1a"
label = { size = 10, priority = 15, minzoom = 16 }

[[rule]]
layer = "pois"
class = "fast_food"
icon = "fast_food"
icon_color = "#1a1a1a"
label = { size = 10, priority = 15, minzoom = 16 }

[[rule]]
layer = "pois"
class = "parking"
icon = "parking"
icon_color = "#1a1a1a"
